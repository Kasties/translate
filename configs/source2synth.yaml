paper: https://arxiv.org/abs/2409.08239v2
random_seed: 42
corpus:
  id: WIKIPEDIA-SV
  api: https://ws.spraakbanken.gu.se/ws/korp/v8
  resource: https://spraakbanken.gu.se/resurser/wikipedia-sv
  doi: https://doi.org/10.23695/7dz6-ek80
  license_as_listed: CC-BY-4.0
  hits_per_entity: 40
  min_words: 25
  max_words: 450
  pairs_per_entity_per_split: 4
  max_pairs_per_training_slice: 40
  max_eval_pairs: 12
  # A small, editable bootstrap vocabulary, not a representative corpus sample.
  # Passages and all question/answer content come from Korp and DataDesigner.
  entities:
    - Alfred Nobel
    - Astrid Lindgren
    - Selma Lagerlöf
    - Carl von Linné
    - Marie Curie
    - Albert Einstein
    - Apollo 11
    - Göta kanal
    - Uppsala universitet
    - Stockholms universitet
    - Ingmar Bergman
    - Olof Palme
model:
  provider: local
  id: google/gemma-4-12B-it
  endpoint: http://127.0.0.1:8080/v1
  temperature: 0.7
  max_tokens: 2048
  max_parallel_requests: 2
  timeout: 180
  extra_body:
    response_format: {type: json_object}
    chat_template_kwargs: {enable_thinking: false}
curation:
  attempts: 3
  # Strict normalized equality, not substring matching.
  answer_matching: normalized_exact
nlu:
  hits_per_query: 100
  max_passages_per_topic_per_split: 100
  generation_max_tokens: 512
  curation_max_tokens: 256
  curation_temperature: 0.1
  # Retry only independent mismatches whose semantic review passed.
  curation_attempts: 3
  # Candidate quotas; acceptance is reported separately, never manufactured.
  records_per_task: 12
  styles: [saklig, lättläst, nyhetsnotis, förklarande]
  difficulties: [enkel, medel, svår]
  topics:
    kultur: [bibliotek, musik, teater]
    vetenskap: [forskning, fysik, universitet]
    samhälle: [kommun, riksdagen, utbildning]
    natur: [skog, sjö, klimat]
    teknik: [dator, järnväg, energi]
    idrott: [fotboll, olympiska, simning]
