# Data-source test: the register-native pipeline with one seed source (fineweb, artifacts/seeds/ahmad/only_fineWeb_14MB/only_fineWeb_14MB.jsonl).
# Gemma 4 31B IT generates and reviews 1,500 rows; Gemma 4 12B is LoRA-tuned on the 259k-token
# subset, like every other run. Run with scripts/run_source_experiment.sh source-fineweb-ahmad.
data:
  source: registers
generator:
  model: google/gemma-4-31B-it
  revision: 842da3794eaa0b77d5f08bae87a17459d91ff475
datagen:
  mode: instructions
  target: 1500  # more than the 259k-token budget needs; the subset is what gets trained on
  batch_size: 25
  max_batches: 100
  require_complete: true
  overrides:
    registers:
      sources:
        - {name: source-fineweb-ahmad, namespace: source-fineweb-ahmad, kind: local, register: fineweb, era: contemporary,
           path: artifacts/seeds/ahmad/only_fineWeb_14MB/only_fineWeb_14MB.jsonl, max_documents: 5000, coherent: true, fields: {id: doc_id},
           license: "ODC-By-1.0 (FineWeb2)", license_url: "https://huggingface.co/datasets/HuggingFaceFW/fineweb-2"}
    instruction_data:
      # Overrides merge into the defaults, so the Korp registers need an explicit 0.
      register_weights: {fineweb: 1, debate: 0, encyclopedia: 0, job-ad: 0}
sft:
  train_file: artifacts/subsets/source-fineweb-ahmad/source-fineweb-ahmad-259k.jsonl
