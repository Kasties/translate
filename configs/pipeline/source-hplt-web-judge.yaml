# Judge ablation: source-hplt-web with Shaurya's LLM-as-a-judge on backtranslation instructions (relevance and
# idiomaticity scored 1-5, both must reach 3; up to 3 rewrites from the judge's feedback). The judge is
# the generator itself, Gemma 4 31B IT, so the judge is the only difference from source-hplt-web.
# Run with scripts/run_source_experiment.sh source-hplt-web-judge.
extends: source-hplt-web.yaml
datagen:
  overrides:
    instruction_data:
      instruction_judge: {enabled: true, threshold: 3, max_refinements: 3}
sft:
  train_file: artifacts/subsets/source-hplt-web-judge/source-hplt-web-judge-259k.jsonl
