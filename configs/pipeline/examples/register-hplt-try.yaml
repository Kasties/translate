# A variant of register-hplt with its own folder, artifacts/pipeline/register-hplt-try/.
# Copy this file under a new name, change name: and the settings, then rebuild with
#   ./pipeline run register-hplt-try --only sources
# Downloads, embeddings and grades are cached, so a rebuild takes minutes.
extends: register-hplt.yaml
name: register-hplt-try
# The knobs people change, at their register-hplt values. Uncomment to change one.
# datagen:
#   overrides:
#     registers:
#       min_words: 150
#       max_words: 400
#       sampling:
#         per_split: 1700
#       scoring:
#         floor: 2.0
#         order: balanced  # or best_first
#       source_settings:  # laid over the hplt-swe entry of sources
#         hplt-swe:
#           max_per_host: 20
#           max_mt: 0.1
#           max_documents: 9000
