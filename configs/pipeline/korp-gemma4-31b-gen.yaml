# Like examples/korp-gemma4.yaml, but Gemma 4 31B IT generates and curates the data.
# Its bf16 weights are 62.5 GB, so it needs a 96 GB card.
#   ./pipeline run configs/pipeline/korp-gemma4-31b-gen.yaml
generator:
  model: google/gemma-4-31B-it
  revision: 842da3794eaa0b77d5f08bae87a17459d91ff475
datagen:
  target: 1000
eval:
  port: 8010  # 8000 is taken on balawar
