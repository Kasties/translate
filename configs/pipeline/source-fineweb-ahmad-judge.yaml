# Judge ablation: source-fineweb-ahmad with Shaurya's LLM-as-a-judge on backtranslation instructions (relevance and
# idiomaticity scored 1-5, both must reach 3; up to 3 rewrites from the judge's feedback). The judge is
# the generator itself, Gemma 4 31B IT, so the judge is the only difference from source-fineweb-ahmad.
# Run with scripts/run_source_experiment.sh source-fineweb-ahmad-judge.
extends: source-fineweb-ahmad.yaml
datagen:
  overrides:
    instruction_data:
      instruction_judge: {enabled: true, threshold: 3, max_refinements: 3}
sft:
  train_file: artifacts/subsets/source-fineweb-ahmad-judge/source-fineweb-ahmad-judge-259k.jsonl
