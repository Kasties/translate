# Shared settings, kept identical across all models and datasets
max_length: 1024
epochs: 1
learning_rate: 2.0e-4
lr_scheduler: cosine
warmup_steps: 20
effective_batch_size: 16
eval_steps: 100
logging_steps: 10

lora:
  r: 16
  alpha: 32
  dropout: 0.05
  modules: [q_proj, k_proj, v_proj, o_proj]

quantization: nf4_4bit
validation_file: /scratch/$USER/swedish-ft/muri_data/validation.jsonl
work_dir: /scratch/$USER/swedish-ft