[project]
name = "tdde19"
version = "0.1.0"
description = "Swedish Korp Source2Synth pipeline using NeMo Data Designer"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "data-designer==0.9.2",
    "pandas>=2.2",
    "pydantic>=2.10",
    "pyyaml>=6",
    "requests>=2.32",
]

[project.optional-dependencies]
registers = ["sentence-transformers>=3,<6", "torch>=2.6"]

[tool.uv]
package = false

# Document embeddings run on CPU in the data environment. GPU training/serving
# retain their separate requirements-training/evaluation environments.
[tool.uv.sources]
torch = [{ index = "pytorch-cpu", extra = "registers" }]

[[tool.uv.index]]
name = "pytorch-cpu"
url = "https://download.pytorch.org/whl/cpu"
explicit = true
